schema_version: "1.1"
name: standalone-verification-publication
expected_outcome: |
  Routes standalone publication through a Jira child using the host defaults.
  The unavailable verifier route does not block publishing completed evidence.
  Reuses the verified self-contained HTML/GCS report and complete per-AC actual
  screenshots. Updates Task comment 9812 with summary, screenshot completeness,
  coverage and report link while preserving unrelated content. No ADF image
  tables or Jira image uploads. Plans readback without contacting Jira or changing
  source in this offline case.
